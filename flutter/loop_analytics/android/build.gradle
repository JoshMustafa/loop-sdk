group = "io.loop.flutter"
version = "2.0.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "io.loop.flutter"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
        // As the native modules build (android/loop-*/build.gradle.kts).
        languageVersion = "1.9"
        apiVersion = "1.9"
        freeCompilerArgs += ["-Xsuppress-version-warnings", "-opt-in=io.loop.core.InternalLoopApi"]
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        // The native loop-core and loop-analytics modules, compiled from the
        // monorepo checkout.
        main.kotlin.srcDirs(
            "../../../android/loop-core/src/main/kotlin",
            "../../../android/loop-analytics/src/main/kotlin"
        )
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        // The native modules' dependencies (android/gradle/libs.versions.toml).
        api("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
        implementation("androidx.lifecycle:lifecycle-process:2.8.7")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
