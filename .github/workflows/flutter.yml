name: Flutter

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Integration tests (example/integration_test) are not run in CI: they need a
# booted iOS simulator and Android emulator. Run them locally on both before
# a release.

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/loop_analytics
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      # The plugin compiles the native iOS sources through committed per-file
      # symlinks. Re-running the link script must leave the tree unchanged.
      - name: iOS vendor symlinks match ios/Sources
        working-directory: .
        run: |
          flutter/loop_analytics/tool/link_native_sources.sh
          git diff --exit-code -- flutter/loop_analytics/ios/Classes/Vendor
          untracked=$(git status --porcelain -- flutter/loop_analytics/ios/Classes/Vendor)
          if [ -n "$untracked" ]; then
            echo "Vendor symlinks are out of date; run tool/link_native_sources.sh and commit:" >&2
            echo "$untracked" >&2
            exit 1
          fi
          # Every native source file must be vendored. The link script only
          # mirrors .swift and PrivacyInfo.xcprivacy, so a new file type in
          # ios/Sources fails here until the script handles it.
          diff -u \
            <(cd ios/Sources && find LoopCore LoopAnalytics -type f | sort) \
            <(cd flutter/loop_analytics/ios/Classes/Vendor && find LoopCore LoopAnalytics -type l | sort)

      - name: Plugin LICENSE matches the repo LICENSE
        working-directory: .
        run: cmp LICENSE flutter/loop_analytics/LICENSE

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/loop_analytics/example
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: flutter build apk --debug
        run: flutter build apk --debug

  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: flutter/loop_analytics/example
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true

      - name: flutter build ios --simulator --no-codesign
        run: flutter build ios --simulator --no-codesign
